<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initiate Plus Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-black text-slate-300 min-h-screen flex items-center justify-center p-6">
    <div id="terminal-page" class="w-full max-w-2xl border border-slate-800 rounded-lg p-6 bg-slate-950 shadow-2xl transition-opacity duration-1000">
      <div class="flex gap-2 mb-6">
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
      </div>

      <div id="console" class="space-y-2 text-sm md:text-base">
        <p class="text-teal-500 font-bold"># System.initialize()</p>
        <p>> Accessing secure database...</p>
        <p>> Searching for "The Most Important Person"...</p>
        <p id="typing-text" class="text-white font-bold h-6"></p>
      </div>

      <button id="next-btn" onclick="revealSurprise()" class="hidden mt-10 w-full py-3 border border-teal-500 text-teal-500 hover:bg-teal-500 hover:text-black transition-all duration-500 font-bold tracking-widest uppercase">
        Initiate Plus Ultra
      </button>
    </div>

    <!-- ==========================================
         2. HALAMAN UTAMA (REVEAL PAGE) - VERSI SKETSA
         ========================================== -->
    <!-- ==========================================
         2. HALAMAN UTAMA (REVEAL PAGE) - REVISI TRANSPARAN
         ========================================== -->
    <div id="reveal-page" class="hidden opacity-0 w-full max-w-6xl min-h-[80vh] flex flex-col justify-center items-center transition-opacity duration-1000 mx-auto px-4 relative">
      
      <!-- HEADER ATAS -->
      <div class="text-center mb-6 z-10">
        <h1 class="text-teal-400 text-4xl md:text-6xl font-black italic tracking-wider filter drop-shadow-[0_0_15px_rgba(20,184,166,0.6)] animate-pulse">PLUS ULTRA!</h1>
      </div>

      <!-- PANGGUNG UTAMA -->
      <div class="w-full flex flex-col md:flex-row items-center justify-center gap-6 relative z-10">
        
        <!-- SISI KIRI: FOTO MIKAELA (TRANSPARAN & TANPA BORDER) -->
        <div class="w-48 md:w-64 flex items-center justify-center relative transform origin-right hover:scale-105 transition duration-500">
          <img src="assets/mikaela.png" class="w-full h-auto object-contain relative z-10 filter drop-shadow-[0_0_20px_rgba(20,184,166,0.3)]" alt="Mikaela">
        </div>

        <!-- SISI TENGAH: PAPAN UCAPAN -->
        <div class="w-full max-w-lg bg-slate-900/90 border-2 border-teal-500/40 rounded-3xl p-6 md:p-8 backdrop-blur-md shadow-[0_0_40px_rgba(20,184,166,0.15)] h-[350px] md:h-[400px] flex flex-col justify-between">
          <div>
            <h3 class="text-xl md:text-2xl text-teal-400 font-bold mb-4 border-b border-slate-800 pb-2 flex items-center gap-2">
              🎉 Happy Birthday Mikaela!
            </h3>
            <!-- KOTAK TEKS DIKOSONGKAN: Nanti diisi otomatis oleh efek mengetik JavaScript -->
            <div id="birthday-letter" class="text-slate-300 space-y-4 leading-relaxed font-mono text-xs md:text-sm h-[220px] overflow-y-auto"></div>
          </div>
          <p class="text-right text-teal-500 font-bold text-xs md:text-sm mt-4 animate-pulse">🔊 Deku is speaking...</p>
        </div>

        <!-- SISI KANAN: KARAKTER DEKU (DIEM/TENANG) -->
        <div class="w-56 md:w-72 flex items-center justify-center relative transform origin-left hover:scale-105 transition duration-500">
          <div class="absolute w-52 h-52 bg-emerald-500/10 rounded-full blur-3xl"></div>
          <!-- Animasinya diubah dari bounce heboh jadi tenang/diem -->
          <img src="assets/dekukue.png" class="w-full h-auto object-contain relative z-10 filter drop-shadow-[0_0_25px_rgba(34,197,94,0.4)]" alt="Deku">
        </div>

      </div>

    </div>

    </div>

    <div id="transition-overlay" class="fixed inset-0 z-50 pointer-events-none hidden"></div>

    <!-- ==========================================
     MINI SPOTIFY PLAYER (MELAYANG & BISA DIGESER)
     ========================================== -->
    <div id="music-player" class="hidden fixed bottom-6 right-6 w-64 bg-slate-900 border border-slate-800 rounded-2xl p-4 shadow-2xl z-40 select-none cursor-grab active:cursor-grabbing transition-opacity duration-500 opacity-0">
      <!-- Gambar Cover (Bisa diisi gambar Deku / Mikaela) -->
      <div class="w-full aspect-square bg-slate-800 rounded-xl overflow-hidden mb-3 relative group">
        <img id="player-cover" src="assets/dekuchibi.jpeg" class="w-full h-full object-cover" />
        <div class="absolute inset-0 bg-black/40 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
          <span class="text-xs text-slate-400 font-mono">Drag to move</span>
        </div>
      </div>

      <!-- Info Lagu -->
      <div class="mb-3">
        <h4 id="player-title" class="text-white font-bold text-sm truncate">Hero Too (Acoustic)</h4>
        <p id="player-artist" class="text-slate-400 text-xs truncate">My Hero Academia</p>
      </div>

      <!-- Progress Bar Mini -->
      <div class="w-full bg-slate-800 h-1 rounded-full overflow-hidden mb-4">
        <div id="player-progress" class="bg-teal-500 h-full w-0 transition-all duration-300"></div>
      </div>

      <!-- Tombol Navigasi Kontrol (Mirip image_266f4b.png) -->
      <div class="flex items-center justify-between px-4">
        <!-- Prev -->
        <button onclick="prevTrack()" class="text-slate-400 hover:text-teal-400 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 6h2v12H6zm3.5 6l8.5 6V6z" /></svg>
        </button>

        <!-- Play / Pause -->
        <button onclick="togglePlay()" class="w-10 h-10 rounded-full bg-white text-black flex items-center justify-center hover:scale-105 transition shadow-lg">
          <div id="play-icon">
            <svg class="w-5 h-5 ml-0.5" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z" /></svg>
          </div>
        </button>

        <!-- Next -->
        <button onclick="nextTrack()" class="text-slate-400 hover:text-teal-400 transition">
          <svg class="w-5 h-5" fill="currentColor" viewBox="0 0 24 24"><path d="M6 18l8.5-6L6 6zm9-12v12h2V6z" /></svg>
        </button>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
