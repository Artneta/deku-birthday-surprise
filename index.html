<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initiate Plus Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-black text-slate-300 min-h-screen flex items-center justify-center p-6">
    <div class="min-h-screen flex items-center justify-center p-4">
      <!-- ==========================================
         1. HALAMAN TERMINAL (INPUT NAMA)
         ========================================== -->
      <div id="terminal-page" class="w-full max-w-lg bg-slate-900 border border-slate-800 rounded-2xl p-6 shadow-2xl transition-all duration-500 font-mono">
        <div class="flex items-center gap-2 mb-4 border-b border-slate-800 pb-3">
          <div class="w-3 h-3 rounded-full bg-red-500"></div>
          <div class="w-3 h-3 rounded-full bg-yellow-500"></div>
          <div class="w-3 h-3 rounded-full bg-green-500"></div>
          <span class="text-xs text-slate-500 ml-2">system_auth.sh</span>
        </div>

        <div id="typing-text" class="text-teal-400 text-sm md:text-base min-h-[1.5rem] mb-4"></div>

        <!-- Form Input Nama Rahasia -->
        <div id="input-container" class="hidden opacity-0 transition-opacity duration-500">
          <p class="text-slate-400 text-xs mb-2">> Enter Subject Name to Access:</p>
          <div class="flex gap-2">
            <input
              type="text"
              id="user-name-input"
              placeholder="Type here..."
              autocomplete="off"
              class="flex-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-teal-400 focus:outline-none focus:border-teal-500 font-mono text-sm"
            />
            <button onclick="checkAccessName()" class="bg-teal-600 hover:bg-teal-500 text-slate-950 font-bold px-4 py-2 rounded-lg text-sm transition">SUBMIT</button>
          </div>
          <p id="error-msg" class="text-red-500 text-xs mt-2 hidden">⚠️ Invalid Subject Name. Access Denied.</p>
        </div>
      </div>

      <!-- ==========================================
         2. LOADING SCREEN (DEKU LARI + PERCENTAGE)
         ========================================== -->
      <div id="loading-page" class="hidden fixed inset-0 bg-slate-950 z-50 flex flex-col items-center justify-center font-mono p-4">
        <!-- GIF Deku Lari (Nanti cari gif deku running/sprint) -->
        <div class="w-48 h-48 mb-4">
          <img src="assets/dekurun.gif" class="w-full h-full object-contain" alt="Deku Running" />
        </div>
        <!-- Angka Persen Loading -->
        <div class="text-teal-400 text-4xl font-black mb-2 tracking-widest"><span id="load-pct">0</span>%</div>
        <div class="w-48 bg-slate-900 h-1.5 rounded-full overflow-hidden border border-slate-800">
          <div id="load-bar" class="bg-gradient-to-r from-teal-500 to-emerald-500 h-full w-0 transition-all duration-100"></div>
        </div>
        <p class="text-slate-500 text-xs mt-3 animate-pulse">Syncing One For All power...</p>
      </div>

      <!-- ==========================================
         3. HALAMAN KURIR DEKU (DEKU BAWA SURAT TERTUTUP)
         ========================================== -->
      <div id="courier-page" class="hidden opacity-0 fixed inset-0 bg-slate-950 z-40 flex flex-col items-center justify-center p-4 transition-all duration-1000">
        <div class="text-center mb-6">
          <h2 class="text-teal-400 text-xl font-mono animate-pulse">📩 YOU RECEIVED A TOP-SECRET LETTER!</h2>
          <p class="text-slate-500 text-xs mt-1">Click on the letter to open it</p>
        </div>

        <!-- Deku besar memegang surat (Bisa di-klik) -->
        <div onclick="openFinalSurprise()" class="cursor-pointer group relative flex flex-col items-center max-w-sm transition transform hover:scale-105 duration-300">
          <!-- Aura Petir tipis di belakang surat -->
          <div class="absolute inset-0 bg-teal-500/10 rounded-full blur-3xl group-hover:bg-teal-500/20 transition"></div>

          <!-- Gambar Deku memegang surat -->
          <img src="assets/dekuletter.png" class="w-72 h-auto object-contain filter drop-shadow-[0_0_15px_rgba(20,184,166,0.3)] group-hover:drop-shadow-[0_0_25px_rgba(20,184,166,0.6)]" alt="Deku Mail" />
        </div>
      </div>

      <!-- ==========================================
         4. PANGGUNG UTAMA (REVEAL PAGE - DARI SKETSA KELAR)
         ========================================== -->
      <div id="reveal-page" class="hidden opacity-0 w-full max-w-6xl min-h-[80vh] flex flex-col justify-center items-center transition-opacity duration-1000 mx-auto px-4 relative">
        <div class="text-center mb-6 z-10">
          <h1 class="text-teal-400 text-4xl md:text-6xl font-black italic tracking-wider filter drop-shadow-[0_0_15px_rgba(20,184,166,0.6)] animate-pulse">PLUS ULTRA!</h1>
        </div>

        <div class="w-full flex flex-col md:flex-row items-center justify-center gap-6 relative z-10">
          <!-- MIKAELA TRANSPARAN -->
          <div class="w-48 md:w-64 flex items-center justify-center relative transform origin-right hover:scale-105 transition duration-500">
            <img src="assets/mikaela.png" class="w-full h-auto object-contain relative z-10 filter drop-shadow-[0_0_20px_rgba(20,184,166,0.3)]" alt="Mikaela" />
          </div>

          <!-- PAPAN UCAPAN -->
          <div class="w-full max-w-lg bg-slate-900/90 border-2 border-teal-500/40 rounded-3xl p-6 md:p-8 backdrop-blur-md shadow-[0_0_40px_rgba(20,184,166,0.15)] h-[350px] md:h-[400px] flex flex-col justify-between">
            <div>
              <h3 class="text-xl md:text-2xl text-teal-400 font-bold mb-4 border-b border-slate-800 pb-2 flex items-center gap-2">🎉 Happy Birthday Mikaela!</h3>
              <div id="birthday-letter" class="text-slate-300 space-y-4 leading-relaxed font-mono text-xs md:text-sm h-[220px] overflow-y-auto"></div>
            </div>
            <p class="text-right text-teal-500 font-bold text-xs md:text-sm mt-4 animate-pulse">🔊 Deku is speaking...</p>
          </div>

          <!-- DEKU DIAM -->
          <div class="w-56 md:w-72 flex items-center justify-center relative transform origin-left hover:scale-105 transition duration-500">
            <div class="absolute w-52 h-52 bg-emerald-500/10 rounded-full blur-3xl"></div>
            <img src="assets/dekukue.png" class="w-full h-auto object-contain relative z-10 filter drop-shadow-[0_0_25px_rgba(34,197,94,0.4)]" alt="Deku" />
          </div>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
