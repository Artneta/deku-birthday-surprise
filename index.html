<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Initiate Plus Ultra</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="bg-black text-slate-300 min-h-screen flex items-center justify-center p-6">
    <div id="terminal-page" class="w-full max-w-2xl border border-slate-800 rounded-lg p-6 bg-slate-950 shadow-2xl transition-opacity duration-1000">
      <div class="flex gap-2 mb-6">
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
        <div class="w-3 h-3 rounded-full bg-slate-800"></div>
      </div>

      <div id="console" class="space-y-2 text-sm md:text-base">
        <p class="text-teal-500 font-bold"># System.initialize()</p>
        <p>> Accessing secure database...</p>
        <p>> Searching for "The Most Important Person"...</p>
        <p id="typing-text" class="text-white font-bold h-6"></p>
      </div>

      <button id="next-btn" onclick="revealSurprise()" class="hidden mt-10 w-full py-3 border border-teal-500 text-teal-500 hover:bg-teal-500 hover:text-black transition-all duration-500 font-bold tracking-widest uppercase">
        Initiate Plus Ultra
      </button>
    </div>

    <div id="reveal-page" class="hidden opacity-0 w-full max-w-4xl transition-opacity duration-1000">
      <div class="text-center">
        <h1 class="text-teal-400 text-5xl md:text-7xl font-bold glitch-green mb-4 italic">PLUS ULTRA!</h1>
        <p class="text-xl text-slate-400 mb-12">Happy Birthday to my favorite hero.</p>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-4">
          <div class="aspect-square bg-slate-900 border border-teal-900 rounded-xl overflow-hidden flex items-center justify-center">
            <span class="text-slate-700">Photo 1</span>
          </div>
          <div class="aspect-square bg-slate-900 border border-teal-900 rounded-xl overflow-hidden flex items-center justify-center">
            <span class="text-slate-700">Photo 2</span>
          </div>
          <div class="aspect-square bg-slate-900 border border-teal-900 rounded-xl overflow-hidden flex items-center justify-center">
            <span class="text-slate-700">Photo 3</span>
          </div>
        </div>
        <!-- Wadah Transisi (Awalnya tersembunyi dengan class hidden) -->
        <div id="transition-overlay" class="fixed inset-0 z-50 pointer-events-none hidden">
          <!-- Kepala Deku bakal dimasukkan ke sini lewat JS -->
        </div>
        <p class="mt-12 text-slate-500 italic">"Go beyond, plus ultra!"</p>
        <script src="script.js"></script>
      </div>
    </div>
  </body>
</html>
